<div class="modal-overlay">
  <div class="modal-content" style="max-width: 400px;">
    <h3>{{ utilisateurEnEdition ? 'Modifier Utilisateur' : 'Nouvel Utilisateur' }}</h3>
    
    <div class="form-group">
      <label>Nom :</label>
      <input type="text" [(ngModel)]="formUtilisateur.nom" placeholder="Nom complet">
    </div>

    <div class="form-group">
      <label>Email :</label>
      <input type="email" [(ngModel)]="formUtilisateur.email" placeholder="adresse@email.com">
    </div>

    <div class="form-group">
      <label>Rôle d'accès :</label>
      <select [(ngModel)]="formUtilisateur.role" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1;">
        <option value="INVITE">👤 Invité (Client standard)</option>
        <option value="ADMIN">🛡️ Administrateur</option>
      </select>
    </div>

    <!-- Le mot de passe n'apparaît QUE pour une création -->
    @if (!utilisateurEnEdition) {
      <div class="form-group">
        <label>Mot de passe initial :</label>
        <input type="password" [(ngModel)]="formUtilisateur.motDePasse" placeholder="Créer un mot de passe">
      </div>
    }

    <div class="modal-actions">
      <button class="btn-cancel" (click)="fermer.emit()">Annuler</button>
      <button class="btn-save" (click)="sauvegarder()">Sauvegarder</button>
    </div>
  </div>
</div>
