<div class="crud-section">
  <h3 style="margin-top: 0;">{{ voyageEnEdition ? 'Gestion du Voyage #' + voyageEnEdition.id : 'Nouveau Voyage Global' }}</h3>
  <hr style="border: none; border-top: 1px solid #e2e8f0; margin-bottom: 20px;">
  
  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <!-- COLONNE GAUCHE : Infos de base -->
    <div style="flex: 1; min-width: 300px;">
      <h4 style="color: #475569;">1. Informations de base</h4>
      <div class="form-group">
        <label>Ville de départ globale :</label>
        <input type="text" [(ngModel)]="formVoyage.villeDepart" placeholder="Ex: Paris">
      </div>
      <div class="form-group">
        <label>Ville d'arrivée globale :</label>
        <input type="text" [(ngModel)]="formVoyage.villeArrivee" placeholder="Ex: Tokyo">
      </div>
      <div class="form-group">
        <label>Prix Total (€) :</label>
        <input type="number" [(ngModel)]="formVoyage.prixTotal" placeholder="0.00">
      </div>
    </div>

    <!-- COLONNE DROITE : Les fameux segments -->
    <div style="flex: 1; min-width: 300px;">
      <h4 style="color: #475569;">2. Segments de l'itinéraire</h4>
      <div class="form-group">
        <label>Cochez les briques qui composent ce voyage :</label>
        <div style="height: 250px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 5px; padding: 10px; background: #f8fafc;">
          
          @if (segmentsDisponibles.length === 0) {
            <p style="color: #94a3b8; font-size: 13px;">Aucun segment dans la base.</p>
          }

          @for (s of segmentsDisponibles; track s.id) {
            <label class="segment-checkbox">
              <input type="checkbox" 
                     [checked]="formVoyage.segmentsIds.includes(s.id)"
                     (change)="toggleSegmentSelection(s.id)">
              <span>
                <strong>#{{ s.id }}</strong> - {{ s.villeDepart || s.ville_depart }} ➔ {{ s.villeArrivee || s.ville_arrivee }}
                <span class="segment-transport">({{ s.moyenTransport || s.moyen_transport }})</span>
              </span>
            </label>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="modal-actions">
    <!-- Le bouton 'Annuler/Retour' est désormais géré par le parent -->
    <button class="btn-save" (click)="sauvegarder()">💾 Enregistrer toutes les modifications</button>
  </div>
</div>
