<div class="reset-container">
  <div class="reset-box">
    <h2>Mot de passe oublié</h2>

    <div *ngIf="messageErreur" class="alert error">{{ messageErreur }}</div>
    <div *ngIf="messageSucces" class="alert success">{{ messageSucces }}</div>

    <form *ngIf="!messageSucces && !afficherBoutonInscription" (ngSubmit)="demanderMotDePasse()">
      <p class="description">Entrez votre adresse e-mail. Si elle est reconnue, nous vous enverrons votre mot de passe actuel.</p>
      
      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="votre@email.com" required [disabled]="isLoading">
      </div>
      
      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Recherche en cours...' : 'Recevoir mon mot de passe' }}
      </button>
      
      <div class="links">
        <a routerLink="/login">Retour à la connexion</a>
      </div>
    </form>

    <div *ngIf="afficherBoutonInscription" class="not-found-zone">
      <p class="description" style="color: #ef4444; font-weight: bold;">Souhaitez-vous créer un compte ?</p>
      <button routerLink="/inscription" class="btn-submit btn-register">Aller à l'inscription</button>
      <div class="links"><a (click)="reessayer()">Réessayer avec une autre adresse</a></div>
    </div>

    <div *ngIf="messageSucces" class="links" style="margin-top: 25px;">
      <button routerLink="/login" class="btn-submit">Retourner à la page de connexion</button>
    </div>
    
  </div>
</div>
