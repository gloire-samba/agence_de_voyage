<div class="profil-container">
  <h2>👤 Mon Profil</h2>
  <p class="subtitle">Gérez vos informations personnelles (ID: {{ idActuel }})</p>

  <div *ngIf="isLoading && !message" style="text-align: center; margin: 20px 0;">
    <p>⏳ Chargement de vos données...</p>
  </div>

  <div class="form-card" *ngIf="!isLoading || message">
    
    <div *ngIf="message" class="alert" [class.success]="message.includes('✅')">{{ message }}</div>

    <div class="form-group">
      <label>Adresse Email</label>
      <input type="email" [(ngModel)]="monProfil.email" placeholder="votre@email.com">
    </div>

    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <div class="password-wrapper">
        <input 
          [type]="hidePassword ? 'password' : 'text'" 
          [(ngModel)]="monProfil.motDePasse" 
          placeholder="Laissez vide pour conserver l'actuel"
        >
        <button type="button" class="btn-eye" (click)="togglePasswordVisibility()">
          {{ hidePassword ? '👁️' : '🙈' }}
        </button>
      </div>
    </div>

    <button class="btn-save" (click)="sauvegarder()" [disabled]="isLoading">
      💾 Mettre à jour mon profil
    </button>
  </div>
</div>
