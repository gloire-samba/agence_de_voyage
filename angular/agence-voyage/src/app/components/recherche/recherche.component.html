<div class="recherche-container">
  <h2>Où souhaitez-vous aller ?</h2>
  
  <div class="search-panel">
    
    <div class="manual-search-row">
      <div class="input-group">
        <label>Départ</label>
        <input type="text" [(ngModel)]="villeDepart" (ngModelChange)="rechercheManuelle()" placeholder="De quelle ville ?" />
      </div>

      <button class="btn-swap" (click)="permuterVilles(); rechercheManuelle()" title="Inverser les villes">⇄</button>

      <div class="input-group">
        <label>Destination</label>
        <input type="text" [(ngModel)]="villeArrivee" (ngModelChange)="rechercheManuelle()" placeholder="Vers où ?" />
      </div>

      <div class="input-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="dateDepart" (ngModelChange)="rechercheManuelle()" />
      </div>

      <div class="input-group">
        <label>Durée Max (h)</label>
        <input type="number" [(ngModel)]="dureeMaxHeures" (ngModelChange)="rechercheManuelle()" placeholder="Ex: 5" style="width: 80px;" />
      </div>

      <div class="input-group">
        <label>Recherche Rapide</label>
        <input type="text" [(ngModel)]="texteRecherche" (ngModelChange)="rechercheManuelle()" placeholder="Mot clé..." />
      </div>
    </div>

    <div class="divider">
      <span>OU</span>
    </div>

    <div class="ia-search-zone">
      <p class="ia-label">Demandez à l'IA</p>
      
      <div class="ia-text-box">
        <input 
          type="text" 
          [(ngModel)]="texteIA" 
          placeholder="Ex: les voyage de moins de 500 €"
          (keyup.enter)="rechercheTexteIA()"
          [disabled]="isLoading"
        />
        <button class="btn-ia-text" (click)="rechercheTexteIA()" [disabled]="isLoading || !texteIA" title="Envoyer à l'IA">✨</button>
      </div>

      <p class="ia-ou">ou parlez-lui</p>

      <button class="btn-mic" [class.recording]="isRecording" (click)="toggleRecording()" [disabled]="isLoading" title="Maintenez pour parler">
        <span *ngIf="!isRecording && !isLoading">🎤</span>
        <span *ngIf="isRecording">🛑</span>
        <span *ngIf="isLoading" class="spinner">⏳</span>
      </button>
    </div>

  </div>

  <div class="feedback-zone" *ngIf="phraseReconnue || erreur">
    <div class="success-msg" *ngIf="phraseReconnue && !erreur">{{ phraseReconnue }}</div>
    <div class="error-msg" *ngIf="erreur">⚠️ {{ erreur }}</div>
  </div>

  <div class="no-results-zone" *ngIf="!isLoading && !erreur && voyagesA_Afficher.length === 0">
    <h3>Aucun voyage trouvé 🏜️</h3>
    <p>
      Votre recherche 
      <strong>"{{ phraseReconnue || villeDepart || villeArrivee || dateDepart || texteRecherche || 'actuelle' }}"</strong> 
      n'a donné aucun résultat.
    </p>
  </div>
</div>

<app-catalogue [voyages]="voyagesA_Afficher" (reserver)="declencherReservation($event)"></app-catalogue>
